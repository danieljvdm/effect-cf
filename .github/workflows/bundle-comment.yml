name: Bundle size comment

on:
  workflow_run:
    workflows: [Bundle size]
    types: [completed]

permissions: {}

# Serialize publishers for one source branch, including fork branches, so two
# completed runs cannot both create the initial sticky comment.
concurrency:
  group: bundle-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-stats
          path: bundle-stats
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The trusted publisher uses only the fixed Actions runtime. Keeping this
      # narrow adapter outside Effect avoids checkout, dependency installation,
      # or execution of any PR/artifact code with the comment-writing token.
      - name: Update bundle comparison comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const fs = require('node:fs');
            const readData = (file, limit) => {
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > limit) throw new Error('Invalid bundle artifact');
              return fs.readFileSync(file, 'utf8');
            };
            const table = readData('bundle-stats/report.md', 12000).trim();
            const lines = table.split('\n');
            const fixtures = ['kv', 'worker', 'durable-object-rpc', 'outbox', 'lazy-worker', 'webtransport'];
            const row = /^\| (kv|worker|durable-object-rpc|outbox|lazy-worker|webtransport) \| (initial|deferred|total) \| (n\/a|\d+\.\d{2} kB) \| \d+\.\d{2} kB \| (new export|[+-]?\d+\.\d{2} kB(?: \/ [+-]?\d+\.\d{2}%)?) \| \d+\.\d{2} kB \|$/;
            if (lines.length < 8 || lines.length > 20 ||
                lines[0] !== '| Fixture | Part | Base gzip | PR gzip | Change | PR minified |' ||
                lines[1] !== '| --- | --- | ---: | ---: | ---: | ---: |' ||
                !lines.slice(2).every(line => row.test(line))) {
              throw new Error('Invalid bundle report table');
            }
            const parts = new Set();
            for (const line of lines.slice(2)) {
              const [, fixture, part] = row.exec(line);
              const key = `${fixture}/${part}`;
              if (parts.has(key)) throw new Error('Duplicate bundle report row');
              parts.add(key);
            }
            if (!fixtures.every(fixture => parts.has(`${fixture}/initial`) &&
                parts.has(`${fixture}/deferred`) === parts.has(`${fixture}/total`))) {
              throw new Error('Incomplete bundle report table');
            }
            const number = readData('bundle-stats/pr-number.txt', 20).trim();
            const report = JSON.parse(readData('bundle-stats/report.json', 64000));
            const sha = /^[a-f0-9]{40}$/;
            if (!/^[1-9][0-9]{0,9}$/.test(number) ||
                !sha.test(report.base?.revision) || !sha.test(report.head?.revision)) {
              throw new Error('Invalid bundle revision or PR number');
            }
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.repository.full_name !== repository || report.head.revision !== run.head_sha) {
              throw new Error('Bundle report does not match its workflow run');
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.head_repository.id ||
                pr.head.ref !== run.head_branch ||
                pr.base.sha !== report.base.revision ||
                pr.base.repo.full_name !== repository) return;
            const marker = '<!-- effect-cf:bundle-size -->';
            const runUrl = `${context.serverUrl}/${repository}/actions/runs/${run.id}`;
            const body = `${marker}\n### Bundle size\n\n${table}\n\n` +
              'Minified ESM for es2022, browser target, including Effect and other dependencies. ' +
              'Native `cloudflare:*` and `node:*` imports remain external. ' +
              'Gzip is measured per chunk. Initial includes statically imported shared chunks; ' +
              'deferred is the remaining output. New exports have no prior baseline.\n\n' +
              `[Chunks, module analysis, and exact bytes](${runUrl}) for \`${run.head_sha.slice(0, 12)}\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
