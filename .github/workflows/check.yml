name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-bun resolves the consumer's packageManager or engines.bun version.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          # Vite+ version intentionally resolves from the consumer manifest/lock.
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile", "--ignore-scripts"]

      - name: Patch Effect TypeScript-Go
        run: vp run patch:tsgo

      - name: "Build packages"
        run: |
          vp run effect-cf#build
          vp run effect-webtransport#build

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp lint

      # Keep the pinned Docker Hub images while avoiding shared-runner pull limits.
      # Uncached images fall back to Docker Hub: https://docs.cloud.google.com/artifact-registry/docs/pull-cached-dockerhub-images
      - name: Configure Docker image cache
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")
          configuration = json.loads(path.read_text()) if path.exists() else {}
          mirrors = configuration.setdefault("registry-mirrors", [])
          if "https://mirror.gcr.io" not in mirrors:
              mirrors.append("https://mirror.gcr.io")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(configuration) + "\n")
          PY
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Test native containers with Docker
        run: vp run test:containers

      - name: Run tests
        run: vp test

      - name: Type check with Effect TypeScript-Go
        run: vp run typecheck
