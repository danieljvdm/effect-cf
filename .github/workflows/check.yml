name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-bun resolves the consumer's packageManager or engines.bun version.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          # Vite+ version intentionally resolves from the consumer manifest/lock.
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile", "--ignore-scripts"]

      - name: Patch Effect TypeScript-Go
        run: vp run patch:tsgo

      - name: "Build packages"
        run: |
          vp run effect-cf#build
          vp run effect-webtransport#build

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp lint

      # Use cached public images before falling back to Docker Hub.
      - name: Configure Docker Hub mirror
        run: |
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path

          config_path = Path("/etc/docker/daemon.json")
          config = json.loads(config_path.read_text()) if config_path.exists() else {}
          mirrors = config.get("registry-mirrors", [])
          config["registry-mirrors"] = list(dict.fromkeys(["https://mirror.gcr.io", *mirrors]))
          config_path.parent.mkdir(parents=True, exist_ok=True)
          config_path.write_text(json.dumps(config))
          PYTHON
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Test native containers with Docker
        run: |
          # Keep the digest aligned with Wrangler/Miniflare's default egress image.
          container_proxy_image=mirror.gcr.io/cloudflare/proxy-everything:3cb1195@sha256:0ef6716c52430096900b150d84a3302057d6cd2319dae7987128c85d0733e3c8
          # A cache miss keeps Wrangler's Docker Hub default and daemon mirror fallback.
          if docker pull "$container_proxy_image"; then
            export MINIFLARE_CONTAINER_EGRESS_IMAGE="$container_proxy_image"
          fi
          vp run test:containers

      - name: Run tests
        run: vp test

      - name: Type check with Effect TypeScript-Go
        run: vp run typecheck
