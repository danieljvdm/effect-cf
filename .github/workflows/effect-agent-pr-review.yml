name: Effect Agent PR review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    # Generated Version Packages updates are release plumbing, not review
    # scope; ordinary PRs touching source alongside these paths still run.
    paths-ignore:
      - ".changeset/**"
      - "bun.lock"
      - "**/CHANGELOG.md"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: effect-agent-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        (startsWith(github.event.comment.body, '@effect-agent review') ||
         startsWith(github.event.comment.body, '/effect-agent review')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted review channel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the Effect Agent GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review the pull request
        uses: danieljvdm/effect-agent/action@a098b8714389c17f5fe76776ac6c99c66185fa72 # action-v0.1.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number }}
          review-author: effect-agent[bot]
          mode: ${{ github.event_name == 'pull_request' && 'auto' || 'incremental' }}
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          automatic-review-limit: 2
          expected-head: ${{ github.event.pull_request.head.sha || '' }}
          effort: medium
          guidance-file: .github/review-guidance.md
          ignore: "bun.lock,**/CHANGELOG.md,.agents/skills/**,.repos/**"
